apiVersion: batch/v1
kind: CronJob
metadata:
  name: briefly-daily-digest
spec:
  schedule: "0 7 * * *"
  timeZone: "Australia/Sydney"
  jobTemplate:
    spec:
      template:
        spec:
          containers:
            - name: trigger-digest
              image: curlimages/curl:latest
              args:
                - "-s"
                - "http://briefly.default.svc.cluster.local:80/send-digest"
          restartPolicy: OnFailure